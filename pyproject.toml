[project]
name = "partsbox-mcp"
version = "0.1.0"
description = "PartsBox MCP Server for parts inventory management"
dependencies = [
    "fastmcp>=2.13.1,<3",
    "requests>=2.32,<3",
    "python-dotenv>=1.0,<2",
    "jmespath>=1.0,<2",
    "Pillow>=10.0,<13",
    "mcp-mapped-resource-lib>=0.1.2,<0.2",
    "typing-extensions>=4.12",
]
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10",
    "pytest-httpserver>=1.1,<2",
    "responses>=0.25,<1",
]

[project.scripts]
partsbox-mcp = "partsbox_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/partsbox_mcp"]

[dependency-groups]
dev = [
    "pytest>=9.0.1,<10",
    "responses>=0.25.8,<1",
]
